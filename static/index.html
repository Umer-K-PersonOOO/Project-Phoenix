<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Learning App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #conversation {
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        #objectives {
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 20px;
        }
        #message {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 10px;
        }
        #sendButton {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        #sendButton:hover {
            background-color: #0056b3;
        }
        /* Pop-up style */
        .popup {
            display: none;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid #ddd;
            padding: 20px;
            background-color: white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }
        .popup button {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        .popup button:hover {
            background-color: #0056b3;
        }
        #menuImage {
            display: none;
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Language Learning App</h1>
    <div id="conversation"></div>
    <div id="objectives"></div>
    <div id="documentInfo"></div>
    <input type="text" id="message" placeholder="Type your message here...">
    <button id="sendButton">Send</button>

    <!-- Pop-up HTML -->
    <div id="popup" class="popup">
        <p>It didn't make sense. Please talk about something related to the restaurant.</p>
        <button onclick="closePopup()">Close</button>
    </div>

    <!-- Menu Image -->
    <img id="menuImage" src="/static/menu.png" alt="Restaurant Menu">

    <script>
        document.getElementById('sendButton').addEventListener('click', function() {
            sendMessage();
        });

        function sendMessage() {
            const message = document.getElementById('message').value;
            if (message.trim() === '') return;
            document.getElementById('message').value = '';

            const conversationDiv = document.getElementById('conversation');
            const userMessageDiv = document.createElement('div');
            userMessageDiv.textContent = 'You: ' + message;
            conversationDiv.appendChild(userMessageDiv);

            fetch('/conversation', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ question: message, initial: false })
            })
            .then(response => response.json())
            .then(data => updateUI(data))
            .catch(error => console.error('Error:', error));
        }

        function initialFetch() {
            fetch('/conversation', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ question: '', initial: true }) // Sending an empty question for initial fetch
            })
            .then(response => response.json())
            .then(data => updateUI(data))
            .catch(error => console.error('Error:', error));
        }

        function updateUI(data) {
            const conversationDiv = document.getElementById('conversation');

            if (data.phoenix_input) {
                const phoenixDiv = document.createElement('div');
                phoenixDiv.textContent = 'Phoenix: ' + data.phoenix_input;
                conversationDiv.appendChild(phoenixDiv);
            }

            if (data.response) {
                const aiMessageDiv = document.createElement('div');
                aiMessageDiv.textContent = 'Gemini: ' + data.response;
                conversationDiv.appendChild(aiMessageDiv);
            }

            conversationDiv.scrollTop = conversationDiv.scrollHeight;

            // Display retrieved document information
            const documentInfoDiv = document.getElementById('documentInfo');
            documentInfoDiv.textContent = 'Document Information: ' + data.retrieved_info;

            // Display current objectives
            const objectivesDiv = document.getElementById('objectives');
            objectivesDiv.innerHTML = '<h3>Objectives:</h3>';
            data.objectives.forEach((objective, index) => {
                const objectiveDiv = document.createElement('div');
                if (index === data.current_objective_index) {
                    objectiveDiv.style.fontWeight = 'bold';
                }
                objectiveDiv.textContent = objective;
                objectivesDiv.appendChild(objectiveDiv);
            });

            // Handle actions
            if (data.action === 'show_menu') {
                document.getElementById('menuImage').style.display = 'block';
            } else {
                document.getElementById('menuImage').style.display = 'none';
            }

            if (data.unrelated) {
                showPopup();
            }
        }

        function showPopup() {
            document.getElementById('popup').style.display = 'block';
        }

        function closePopup() {
            document.getElementById('popup').style.display = 'none';
        }

        // Initial fetch to display information and objectives
        initialFetch();
    </script>
</body>
</html>
